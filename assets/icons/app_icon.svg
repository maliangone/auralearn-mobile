        C568 520 637 497 719 508
        C739 511 754 528 754 549
        V691
        C754 716 731 733 706 728
        C631 713 566 725 512 768 Z"
      fill="#FFFFFF"
      stroke="#FFFFFF"
      stroke-width="12"
      stroke-linejoin="round"
    />
    <path
      d="M512 566 V768"
      fill="none"
      stroke="#D8E1FF"
      stroke-width="12"
      stroke-linecap="round"
    />
    <path
      d="M306 550 C372 540 430 553 483 583"
      fill="none"
      stroke="#D8E1FF"
      stroke-width="12"
      stroke-linecap="round"
      opacity="0.85"
    />
    <path
      d="M718 550 C652 540 594 553 541 583"
      fill="none"
      stroke="#D8E1FF"
      stroke-width="12"
      stroke-linecap="round"
      opacity="0.85"
    />
  </g>
</svg>
