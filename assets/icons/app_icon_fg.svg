<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <title>AuraLearn adaptive icon foreground</title>
  <desc>An open book with a glowing amber spark on a transparent background.</desc>
  <defs>
    <filter id="sparkGlow" x="-80%" y="-80%" width="260%" height="260%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceGraphic" stdDeviation="20" result="blur" />
      <feFlood flood-color="#F59E0B" flood-opacity="0.55" result="glowColor" />
      <feComposite in="glowColor" in2="blur" operator="in" result="glow" />
      <feMerge>
        <feMergeNode in="glow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

