name: auralearn
description: An interactive education Q&A app for students and parents

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # UI & Navigation
  cupertino_icons: ^1.0.2
  go_router: ^12.1.3
  flutter_staggered_animations: ^1.1.1
  lottie: ^2.7.0
  shimmer: ^3.0.0

  # Image Handling
  image_picker: ^1.0.4
  image_cropper: ^8.0.1
  cached_network_image: ^3.3.0
  photo_view: ^0.14.0
  image: ^4.1.3

  # HTTP & API
  http: ^1.1.0
  dio: ^4.0.0
  dio_logging_interceptor: ^1.0.1
  retrofit: ^3.3.1
  json_annotation: ^4.8.1

  # State Management
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5
  dartz: ^0.10.1

  # Local Storage
  shared_preferences: ^2.2.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  sqflite: ^2.3.0

  # Local-first DB (Drift) — authoritative store
  drift: ^2.14.0
  sqlite3_flutter_libs: ^0.5.18
  path: ^1.8.3

  # Authentication
  jwt_decoder: ^2.0.1
  crypto: ^3.0.3
  flutter_secure_storage: ^9.2.2

  # OAuth sign-in (Phase C) — packages build now; real sign-in needs
  # platform/user OAuth client config (google-services / Apple capability).
  google_sign_in: ^6.2.1
  sign_in_with_apple: ^6.1.3

  # File Handling
  path_provider: ^2.1.1
  permission_handler: ^11.0.1
  # Document/image picking (Phase C document import).
  file_picker: ^8.1.6
  # Pure-Dart PDF text extraction (PdfTextExtractor) for context-stuffing.
  syncfusion_flutter_pdf: ^28.1.33

  # In-App Purchase
  in_app_purchase: ^3.1.11

  # Utils
  uuid: ^4.2.2
  intl: ^0.20.2
  logger: ^2.0.2+1
  connectivity_plus: ^5.0.2
  get_it: ^7.6.4
  device_info_plus: ^9.1.1
  url_launcher: ^6.2.5

  # UI Components
  flutter_keyboard_visibility: ^6.0.0
  flutter_svg: ^2.0.9
  badges: ^3.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Code Generation
  build_runner: ^2.4.7
  retrofit_generator: ^4.2.0
  json_serializable: ^6.7.1
  hive_generator: ^2.0.1
  drift_dev: ^2.14.0

  # Linting
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
    - assets/fonts/
    - assets/illustrations/
    - assets/onboarding/
    - assets/brand/

  fonts:
    # Baloo 2 — friendly rounded display font for Latin/digits.
    # CJK glyphs fall back to the platform font automatically.
    # OFL licensed; static instances derived from the variable font.
    - family: Baloo2
      fonts:
        - asset: assets/fonts/Baloo2-Regular.ttf
          weight: 400
        - asset: assets/fonts/Baloo2-Medium.ttf
          weight: 500
        - asset: assets/fonts/Baloo2-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Baloo2-Bold.ttf
          weight: 700 