name: auralearn
description: An interactive education Q&A app for students and parents

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter

  # UI & Navigation
  cupertino_icons: ^1.0.2
  go_router: ^12.1.3
  flutter_staggered_animations: ^1.1.1
  lottie: ^2.7.0
  shimmer: ^3.0.0

  # Image Handling
  image_picker: ^1.0.4
  image_cropper: ^5.0.1
  cached_network_image: ^3.3.0
  photo_view: ^0.14.0
  image: ^4.1.3

  # HTTP & API
  http: ^1.1.0
  dio: ^4.0.0
  dio_logging_interceptor: ^1.0.1
  retrofit: ^3.3.1
  json_annotation: ^4.8.1

  # State Management
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5
  dartz: ^0.10.1

  # Local Storage
  shared_preferences: ^2.2.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  sqflite: ^2.3.0

  # Authentication
  jwt_decoder: ^2.0.1
  crypto: ^3.0.3

  # File Handling
  path_provider: ^2.1.1
  permission_handler: ^11.0.1
  file_picker: ^6.1.1

  # In-App Purchase
  in_app_purchase: ^3.1.11

  # Utils
  uuid: ^4.2.2
  intl: ^0.19.0
  logger: ^2.0.2+1
  connectivity_plus: ^5.0.2
  get_it: ^7.6.4
  device_info_plus: ^9.1.1

  # UI Components
  flutter_keyboard_visibility: ^6.0.0
  flutter_svg: ^2.0.9
  badges: ^3.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Code Generation
  build_runner: ^2.4.7
  retrofit_generator: ^4.2.0
  json_serializable: ^6.7.1
  hive_generator: ^2.0.1

  # Linting
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
    - assets/fonts/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700 