# gitleaks config for the AuraLearn proxy.
# Wired as a CI/release gate (Critic M1): the build fails on any detected key.
# Run locally:  gitleaks detect --config .gitleaks.toml --no-git --source .
# Run in CI:    gitleaks detect --config .gitleaks.toml --redact
#
# This config is INTENTIONALLY strict: it inherits the gitleaks defaults AND
# adds explicit Anthropic / generic `sk-` rules so a leaked key fails the gate.

title = "AuraLearn proxy secret scan"

# Inherit gitleaks' built-in ruleset (covers most cloud/provider keys).
[extend]
useDefault = true

# --- Custom rules ---

[[rules]]
id = "anthropic-api-key"
description = "Anthropic API key"
# Anthropic keys look like sk-ant-... ; match the prefix + a long body.
regex = '''sk-ant-[A-Za-z0-9_\-]{20,}'''
keywords = ["sk-ant"]

[[rules]]
id = "anthropic-oauth-token"
description = "Anthropic OAuth / environment token"
regex = '''sk-ant-oat[0-9]{2}-[A-Za-z0-9_\-]{20,}'''
keywords = ["sk-ant-oat"]

[[rules]]
id = "generic-sk-key"
description = "Generic sk- prefixed secret (OpenAI/Anthropic/etc.)"
regex = '''\bsk-[A-Za-z0-9][A-Za-z0-9_\-]{20,}\b'''
keywords = ["sk-"]

# --- Allowlist ---
# .env.example and docs intentionally contain the LITERAL strings below
# (placeholders / format documentation), which must NOT trip the scanner.
[allowlist]
description = "Placeholders and documentation strings that are not real secrets"
paths = [
  '''\.env\.example$''',
  '''README\.md$''',
  '''\.gitleaks\.toml$''',
]
regexes = [
  '''ANTHROPIC_API_KEY=\s*$''',
  '''sk-ant-XXXX''',
  '''sk-ant-\.\.\.''',
  '''dev-local-token''',
]
